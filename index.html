<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <title>KTA Workspace Pro Max | Quản Lý Cầu Lông</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #030712; --bg-surface: #111827; --bg-surface-elevated: #1f2937;
            --text-primary: #f9fafb; --text-secondary: #9ca3af;
            --accent-primary: #10b981; --accent-glow: rgba(16, 185, 129, 0.35);
            --danger: #ef4444; --border-light: rgba(255, 255, 255, 0.08);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-primary); }
        
        .app-view { display: none; width: 100%; min-height: 100vh; }
        .app-view.active { display: block; animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; color: white; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.6; pointer-events: none; }
        .btn-primary { background: var(--accent-primary); box-shadow: 0 4px 20px var(--accent-glow); }
        .btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid var(--border-light); }

        .form-group { position: relative; margin-bottom: 20px; }
        .form-input { width: 100%; background: var(--bg-surface); border: 1px solid var(--border-light); padding: 16px; border-radius: 12px; color: white; font-size: 15px; outline: none; }
        .form-input:focus { border-color: var(--accent-primary); }
        .form-label { position: absolute; left: 16px; top: 16px; color: var(--text-secondary); font-size: 14px; pointer-events: none; transition: 0.3s; }
        .form-input:focus ~ .form-label, .form-input:not(:placeholder-shown) ~ .form-label { top: -10px; left: 12px; font-size: 12px; font-weight: 700; color: var(--accent-primary); background: var(--bg-body); padding: 0 6px; }

        .glass-card { background: var(--bg-surface-elevated); border: 1px solid var(--border-light); border-radius: 20px; padding: 24px; }
        
        /* AUTH TABS */
        .auth-tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid var(--border-light); }
        .auth-tab { flex: 1; text-align: center; padding: 12px; font-weight: 700; color: var(--text-secondary); cursor: pointer; border-bottom: 3px solid transparent; }
        .auth-tab.active { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }
        .auth-form { display: none; }
        .auth-form.active { display: block; animation: fadeIn 0.3s; }

        /* TOAST */
        #toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 99999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
        .kta-toast { background: var(--bg-surface-elevated); color: white; padding: 14px 20px; border-radius: 12px; border-left: 4px solid var(--accent-primary); box-shadow: 0 10px 30px rgba(0,0,0,0.8); font-weight: 600; font-size: 14px; opacity: 0; transform: translateY(20px); transition: 0.3s; }
        .kta-toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <!-- VIEW 1: AUTHENTICATION (Bắt buộc) -->
    <main id="view-auth" class="app-view active">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
            <div class="glass-card" style="width: 100%; max-width: 420px;">
                <div style="text-align: center; margin-bottom: 24px;">
                    <img src="logo.png" alt="Logo" style="width: 64px; border-radius: 16px; margin-bottom: 12px;" onerror="this.style.display='none'">
                    <h2 style="font-size: 22px; font-weight: 900;">KTA WORKSPACE</h2>
                    <p style="font-size: 13px; color: var(--text-secondary);">Vui lòng đăng nhập để vào hệ thống</p>
                </div>

                <div class="auth-tabs">
                    <div class="auth-tab active" onclick="KTA_App.Auth.switchTab('login')">ĐĂNG NHẬP</div>
                    <div class="auth-tab" onclick="KTA_App.Auth.switchTab('register')">ĐĂNG KÝ</div>
                </div>

                <!-- Form Login -->
                <form id="form-login" class="auth-form active" onsubmit="KTA_App.Auth.login(event)">
                    <div class="form-group"><input type="tel" id="lgPhone" class="form-input" required placeholder=" "><label class="form-label">Số điện thoại</label></div>
                    <div class="form-group"><input type="password" id="lgPass" class="form-input" required placeholder=" "><label class="form-label">Mật khẩu</label></div>
                    <button type="submit" id="btnLogin" class="btn btn-primary">Đăng Nhập</button>
                </form>

                <!-- Form Register -->
                <form id="form-register" class="auth-form" onsubmit="KTA_App.Auth.register(event)">
                    <div class="form-group"><input type="text" id="rgName" class="form-input" required placeholder=" "><label class="form-label">Họ và Tên</label></div>
                    <div class="form-group"><input type="tel" id="rgPhone" class="form-input" required placeholder=" "><label class="form-label">Số điện thoại</label></div>
                    <div class="form-group"><input type="password" id="rgPass" class="form-input" required placeholder=" "><label class="form-label">Mật khẩu</label></div>
                    <button type="submit" id="btnRegister" class="btn btn-primary">Đăng Ký Tài Khoản</button>
                </form>
            </div>
        </div>
    </main>

    <!-- VIEW 2: GUEST PORTAL -->
    <main id="view-guest" class="app-view">
        <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-light); padding-bottom: 16px;">
                <h2 style="font-size: 20px; font-weight: 900; color: var(--accent-primary);">KTA Lông Thủ</h2>
                <button class="btn btn-secondary" style="width:auto; padding:8px 16px; font-size:13px;" onclick="KTA_App.Auth.logout()">Đăng xuất</button>
            </div>
            
            <div style="background: var(--bg-surface-elevated); padding: 16px; border-radius: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="color: var(--text-secondary); font-size: 13px;">Xin chào,</div>
                    <div id="guestNameDisplay" style="font-size: 18px; font-weight: 800; color: white;">Khách hàng</div>
                </div>
                <button class="btn btn-primary" style="width:auto; padding:8px 16px; font-size:12px;" onclick="KTA_App.Guest.requestHost()">Xin quyền Host</button>
            </div>

            <h3 style="font-size: 16px; margin-bottom: 16px;">Lịch Đặt Sân Hôm Nay</h3>
            <div id="guestSessionList"></div>
        </div>
    </main>

    <!-- VIEW 3: HOST DASHBOARD -->
    <main id="view-host" class="app-view">
        <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-light); padding-bottom: 16px;">
                <h2 style="font-size: 20px; font-weight: 900; color: var(--accent-primary);">KTA Quản Trị (Host)</h2>
                <button class="btn btn-secondary" style="width:auto; padding:8px 16px; font-size:13px;" onclick="KTA_App.Auth.logout()">Đăng xuất</button>
            </div>

            <div class="glass-card">
                <h3 style="font-size: 18px; margin-bottom: 16px;">Tạo Kèo Nhanh</h3>
                <form onsubmit="KTA_App.Host.createSession(event)">
                    <div class="form-group"><input type="text" id="hcTime" class="form-input" required placeholder=" "><label class="form-label">Thời gian (VD: 19h T6)</label></div>
                    <div class="form-group"><input type="text" id="hcLoc" class="form-input" required placeholder=" "><label class="form-label">Tên Sân Bãi</label></div>
                    <div class="form-group"><input type="number" id="hcMax" class="form-input" required placeholder=" " value="8"><label class="form-label">Số người tối đa</label></div>
                    <button type="submit" id="btnCreateSess" class="btn btn-primary">Tạo Lịch Sân Lên DB</button>
                </form>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>

    <script>
        const KTA_App = {
            Config: {
                // SẾP ĐIỀN LINK GOOGLE APPS SCRIPT WEB APP VÀO ĐÂY NHÉ:
                API_URL: 'https://script.google.com/macros/s/AKfycbzOZgNrN2ynajhIq-5HM1dp6SgoUhc353H8s3sjbGuajyYRj6AS2B6o5QJBhJCkjtg/exec'
            },
            State: { currentUser: null },

            Init: function() {
                // Kiểm tra xem đã đăng nhập chưa từ LocalStorage
                const savedUser = localStorage.getItem('kta_user_data');
                if (savedUser) {
                    this.State.currentUser = JSON.parse(savedUser);
                    this.routeUser();
                } else {
                    this.Router.navigate('view-auth');
                }
            },

            Router: {
                navigate: function(id) {
                    document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
                    document.getElementById(id).classList.add('active');
                }
            },

            routeUser: function() {
                if(!this.State.currentUser) return this.Router.navigate('view-auth');
                if(this.State.currentUser.role === 'host') {
                    this.Router.navigate('view-host');
                } else {
                    this.Router.navigate('view-guest');
                    document.getElementById('guestNameDisplay').innerText = this.State.currentUser.name;
                    this.Guest.fetchSessions();
                }
            },

            UI: {
                toast: function(type, msg) {
                    const c = document.getElementById('toast-container');
                    const t = document.createElement('div');
                    t.className = `kta-toast ${type}`;
                    t.innerText = msg;
                    if(type === 'error') t.style.borderLeftColor = 'var(--danger)';
                    c.appendChild(t);
                    setTimeout(() => t.classList.add('show'), 20);
                    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
                }
            },

            // HÀM MÃ HÓA MẬT KHẨU SHA-256 NGAY TRÊN TRÌNH DUYỆT (Client-side)
            hashPassword: async function(message) {
                const msgBuffer = new TextEncoder().encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            },

            API: {
                execute: async function(action = null, payload = null) {
                    try {
                        const url = action ? `${KTA_App.Config.API_URL}?action=${action}` : KTA_App.Config.API_URL;
                        const options = payload ? { method: 'POST', redirect: 'follow', body: JSON.stringify(payload) } : { method: 'GET', redirect: 'follow' };
                        const res = await fetch(url, options);
                        const text = await res.text();
                        return JSON.parse(text);
                    } catch (err) {
                        return {status: 'error', msg: 'Không thể kết nối đến Database!'};
                    }
                }
            },

            Auth: {
                switchTab: function(type) {
                    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                    
                    if(type === 'login') {
                        document.querySelectorAll('.auth-tab')[0].classList.add('active');
                        document.getElementById('form-login').classList.add('active');
                    } else {
                        document.querySelectorAll('.auth-tab')[1].classList.add('active');
                        document.getElementById('form-register').classList.add('active');
                    }
                },

                login: async function(e) {
                    e.preventDefault();
                    const phone = document.getElementById('lgPhone').value.trim();
                    const pass = document.getElementById('lgPass').value;
                    const btn = document.getElementById('btnLogin');
                    
                    btn.innerText = 'Đang kiểm tra...'; btn.disabled = true;
                    const hashedPass = await KTA_App.hashPassword(pass); // Mã hóa trước khi gửi

                    const res = await KTA_App.API.execute('login', { phone: phone, password: hashedPass });
                    
                    if (res.status === 'success') {
                        KTA_App.UI.toast('success', res.msg);
                        localStorage.setItem('kta_user_data', JSON.stringify(res.user));
                        KTA_App.State.currentUser = res.user;
                        KTA_App.routeUser();
                    } else {
                        KTA_App.UI.toast('error', res.msg);
                    }
                    btn.innerText = 'Đăng Nhập'; btn.disabled = false;
                },

                register: async function(e) {
                    e.preventDefault();
                    const name = document.getElementById('rgName').value.trim();
                    const phone = document.getElementById('rgPhone').value.trim();
                    const pass = document.getElementById('rgPass').value;
                    const btn = document.getElementById('btnRegister');

                    btn.innerText = 'Đang tạo Database...'; btn.disabled = true;
                    const hashedPass = await KTA_App.hashPassword(pass); // Mã hóa an toàn

                    const res = await KTA_App.API.execute('register', { name: name, phone: phone, password: hashedPass });
                    
                    if (res.status === 'success') {
                        KTA_App.UI.toast('success', res.msg);
                        localStorage.setItem('kta_user_data', JSON.stringify(res.user));
                        KTA_App.State.currentUser = res.user;
                        KTA_App.routeUser();
                    } else {
                        KTA_App.UI.toast('error', res.msg);
                    }
                    btn.innerText = 'Đăng Ký Tài Khoản'; btn.disabled = false;
                },

                logout: function() {
                    localStorage.removeItem('kta_user_data');
                    KTA_App.State.currentUser = null;
                    KTA_App.Router.navigate('view-auth');
                    KTA_App.UI.toast('success', 'Đã đăng xuất!');
                }
            },

            Guest: {
                fetchSessions: async function() {
                    const list = document.getElementById('guestSessionList');
                    list.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-secondary);">Đang đồng bộ DB...</div>`;
                    
                    const res = await KTA_App.API.execute('getSessions');
                    if (res.status === 'success' && res.data.length > 0) {
                        list.innerHTML = res.data.reverse().map(s => `
                            <div style="background:var(--bg-surface-elevated); padding:16px; border-radius:12px; margin-bottom:12px; border: 1px solid var(--border-light);">
                                <div style="font-weight:800; font-size:16px;">📍 ${s.Location}</div>
                                <div style="font-size:13px; color:var(--text-secondary); margin-top:4px;">⏰ ${s.Time} | Host: ${s.Host}</div>
                                <div style="font-size:12px; color:var(--accent-primary); margin-top:8px;">✅ Số lượng: ${s.Max} Slot</div>
                            </div>
                        `).join('');
                    } else {
                        list.innerHTML = `<div style="text-align:center; padding:20px;">Chưa có kèo nào hôm nay.</div>`;
                    }
                },
                
                requestHost: async function() {
                    const res = await KTA_App.API.execute('requestHost', { phone: KTA_App.State.currentUser.phone });
                    if (res.status === 'success') KTA_App.UI.toast('success', res.msg);
                    else KTA_App.UI.toast('error', res.msg);
                }
            },

            Host: {
                createSession: async function(e) {
                    e.preventDefault();
                    const btn = document.getElementById('btnCreateSess');
                    btn.innerText = 'Đang đẩy lên DB...'; btn.disabled = true;

                    const data = {
                        id: 'S_' + Date.now(),
                        host: KTA_App.State.currentUser.name,
                        time: document.getElementById('hcTime').value,
                        location: document.getElementById('hcLoc').value,
                        max: document.getElementById('hcMax').value
                    };

                    const res = await KTA_App.API.execute('createSession', data);
                    if (res.status === 'success') {
                        KTA_App.UI.toast('success', res.msg);
                        e.target.reset();
                    } else {
                        KTA_App.UI.toast('error', res.msg);
                    }
                    
                    btn.innerText = 'Tạo Lịch Sân Lên DB'; btn.disabled = false;
                }
            }
        };

        window.onload = () => KTA_App.Init();
    </script>
</body>
</html>
