<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KTA Workspace | Quản Trị Hệ Thống</title>
    
    <!-- Font Inter Cao Cấp -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           1. DESIGN SYSTEM & TOKENS
           ========================================================= */
        :root {
            --bg-body: #050505;
            --bg-glass: rgba(20, 20, 20, 0.7);
            --bg-surface: #111111;
            --bg-surface-hover: #1a1a1a;
            
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-focus: #10b981;
            
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --danger: #ef4444;
            --primary: #3b82f6;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 32px;
            
            --ease: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            overflow-x: hidden;
            /* Tạo background lưới grid mờ cực sang */
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Hiệu ứng gợn sóng khi bấm nút (Ripple) */
        .ripple { position: relative; overflow: hidden; }
        .ripple::after {
            content: ""; display: block; position: absolute; width: 100%; height: 100%;
            top: 0; left: 0; pointer-events: none;
            background-image: radial-gradient(circle, #fff 10%, transparent 10.01%);
            background-repeat: no-repeat; background-position: 50%;
            transform: scale(10, 10); opacity: 0; transition: transform .5s, opacity 1s;
        }
        .ripple:active::after { transform: scale(0, 0); opacity: 0.2; transition: 0s; }

        /* =========================================================
           2. LOCK SCREEN (MÀN HÌNH KHÓA MÃ PIN NHƯ IOS)
           ========================================================= */
        #lockScreen {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s var(--ease), visibility 0.5s;
        }
        .lock-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 320px; }
        .lock-icon { width: 50px; height: 50px; color: var(--accent); margin-bottom: 20px; animation: pulseGlow 2s infinite; }
        .lock-title { font-size: 18px; font-weight: 600; margin-bottom: 30px; letter-spacing: 1px; }
        
        /* Chấm tròn hiển thị Passcode */
        .pin-dots { display: flex; gap: 20px; margin-bottom: 40px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-glass); transition: 0.2s; }
        .dot.filled { background: var(--text-primary); border-color: var(--text-primary); box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .dot.error { border-color: var(--danger); background: var(--danger); }

        /* Bàn phím số Numpad */
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; padding: 0 20px; }
        .num-btn {
            width: 70px; height: 70px; margin: 0 auto; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.05); color: white; font-size: 24px; font-weight: 500;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: 0.1s; backdrop-filter: blur(5px);
        }
        .num-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.9); }
        .num-btn.text-btn { font-size: 14px; font-weight: 600; background: transparent; }

        @keyframes pulseGlow { 0% { filter: drop-shadow(0 0 5px var(--accent-glow)); } 50% { filter: drop-shadow(0 0 20px var(--accent)); } 100% { filter: drop-shadow(0 0 5px var(--accent-glow)); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .shake-anim { animation: shake 0.4s; }

        /* =========================================================
           3. MAIN LAYOUT (SIDEBAR + CONTENT)
           ========================================================= */
        #appCore { display: none; width: 100%; height: 100vh; overflow: hidden; opacity: 0; transition: opacity 0.6s var(--ease); }
        .layout-wrapper { display: flex; height: 100%; }
        
        /* Sidebar (Bottom Nav trên Mobile) */
        .sidebar {
            width: 260px; background: var(--bg-surface); border-right: 1px solid var(--border-glass);
            display: flex; flex-direction: column; padding: 24px 16px; z-index: 100;
        }
        .brand { font-size: 22px; font-weight: 800; color: white; display: flex; align-items: center; gap: 10px; margin-bottom: 40px; padding: 0 10px; }
        .brand svg { color: var(--accent); }
        
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 8px;
            border-radius: var(--radius-md); color: var(--text-secondary); text-decoration: none;
            font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.3s;
        }
        .nav-item svg { width: 20px; height: 20px; transition: 0.3s; }
        .nav-item:hover { background: rgba(255,255,255,0.03); color: white; }
        .nav-item.active { background: rgba(16, 185, 129, 0.1); color: var(--accent); }
        .nav-item.active svg { color: var(--accent); }

        .main-content { flex: 1; overflow-y: auto; padding: 32px; position: relative; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header-title { font-size: 28px; font-weight: 700; color: white; }
        .header-user { display: flex; align-items: center; gap: 12px; background: var(--bg-surface); padding: 8px 16px 8px 8px; border-radius: var(--radius-pill); border: 1px solid var(--border-glass); }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--primary)); display: flex; justify-content: center; align-items: center; font-weight: bold; }

        @media (max-width: 768px) {
            .layout-wrapper { flex-direction: column; }
            .sidebar { 
                width: 100%; height: 70px; flex-direction: row; justify-content: space-around; align-items: center;
                border-right: none; border-top: 1px solid var(--border-glass); padding: 0;
                position: fixed; bottom: 0; left: 0; background: rgba(17,17,17,0.9); backdrop-filter: blur(10px);
            }
            .brand { display: none; }
            .nav-item { flex-direction: column; gap: 4px; padding: 8px; font-size: 11px; margin: 0; border-radius: 0; }
            .nav-item.active { background: transparent; }
            .main-content { padding: 20px 16px 90px 16px; }
            .header-title { font-size: 22px; }
            .header-user span { display: none; } /* Ẩn tên trên mobile cho gọn */
        }

        /* =========================================================
           4. COMPONENTS (CARDS, FLOATING FORMS)
           ========================================================= */
        .glass-card {
            background: var(--bg-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass); border-radius: var(--radius-lg);
            padding: 24px; margin-bottom: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.5s var(--ease);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Form Floating Labels Xịn Xò */
        .form-group { position: relative; margin-bottom: 24px; }
        .form-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass);
            padding: 16px; border-radius: var(--radius-md); color: white; font-size: 15px;
            outline: none; transition: 0.3s;
        }
        .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(16,185,129,0.1); }
        .form-label {
            position: absolute; left: 16px; top: 16px; color: var(--text-secondary);
            font-size: 15px; pointer-events: none; transition: 0.3s var(--ease);
        }
        /* Khi input có chữ hoặc đang focus thì label bay lên thu nhỏ lại */
        .form-input:focus ~ .form-label, .form-input:not(:placeholder-shown) ~ .form-label {
            top: -10px; left: 12px; font-size: 12px; color: var(--accent);
            background: var(--bg-surface); padding: 0 6px; border-radius: 4px;
        }

        select.form-input { appearance: none; }
        .select-icon { position: absolute; right: 16px; top: 18px; pointer-events: none; color: var(--text-secondary); }

        .btn {
            width: 100%; padding: 16px; border-radius: var(--radius-md); border: none;
            font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 8px; color: white;
        }
        .btn-primary { background: var(--accent); box-shadow: 0 4px 20px rgba(16,185,129,0.3); }
        .btn-primary:active { transform: scale(0.97); background: #0ea5e9; } /* Đổi màu nhẹ khi bấm */
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        /* =========================================================
           5. DATA LIST & BILL SPLITTER
           ========================================================= */
        .data-list { display: flex; flex-direction: column; gap: 16px; }
        .data-item {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-glass);
            border-radius: var(--radius-md); padding: 16px; display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s;
        }
        .data-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; background: rgba(16,185,129,0.1); color: var(--accent); border: 1px solid rgba(16,185,129,0.3); }

        /* =========================================================
           6. TOAST NOTIFICATION VỚI THANH TIẾN ĐỘ (PROGRESS)
           ========================================================= */
        #toastArea { position: fixed; bottom: 30px; right: 30px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; }
        .kta-toast {
            background: var(--bg-surface); border-left: 4px solid var(--accent); color: white;
            padding: 16px 24px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 12px; min-width: 300px;
            transform: translateX(120%); transition: transform 0.5s var(--ease);
            position: relative; overflow: hidden;
        }
        .kta-toast.show { transform: translateX(0); }
        .kta-toast.error { border-left-color: var(--danger); }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--accent); width: 100%; animation: progress 3s linear forwards; }
        .kta-toast.error .toast-progress { background: var(--danger); }
        @keyframes progress { to { width: 0%; } }
        @media (max-width: 768px) { #toastArea { top: 20px; bottom: auto; right: 50%; transform: translateX(50%); align-items: center; } .kta-toast { transform: translateY(-120%); } .kta-toast.show { transform: translateY(0); } }

        /* Giao diện Ẩn/Hiện Tabs */
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
    </style>
</head>
<body>

    <!-- 1. MÀN HÌNH KHÓA (SECURITY) -->
    <div id="lockScreen">
        <div class="lock-container" id="lockContainer">
            <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <div class="lock-title">NHẬP MÃ PIN HOST</div>
            
            <div class="pin-dots">
                <div class="dot" id="dot-1"></div><div class="dot" id="dot-2"></div>
                <div class="dot" id="dot-3"></div><div class="dot" id="dot-4"></div>
            </div>

            <div class="numpad">
                <button class="num-btn ripple" onclick="KTA_App.Security.press(1)">1</button>
                <button class="num-btn ripple" onclick="KTA_App.Security.press(2)">2</button>
                <button class="num-btn ripple" onclick="KTA_App.Security.press(3)">3</button>
                <button class="num-btn ripple" onclick="KTA_App.Security.press(4)">4</button>
                <button class="num-btn ripple" onclick="KTA_App.Security.press(5)">5</button>
                <button class="num-btn ripple" onclick="KTA_App.Security.press(6)">6</button>
                <button class="num-btn ripple" onclick="KTA_App.Security.press(7)">7</button>
                <button class="num-btn ripple" onclick="KTA_App.Security.press(8)">8</button>
                <button class="num-btn ripple" onclick="KTA_App.Security.press(9)">9</button>
                <button class="num-btn text-btn ripple" onclick="window.location.href='index.html'">THOÁT</button>
                <button class="num-btn ripple" onclick="KTA_App.Security.press(0)">0</button>
                <button class="num-btn text-btn ripple" onclick="KTA_App.Security.delete()">XÓA</button>
            </div>
        </div>
    </div>

    <!-- 2. GIAO DIỆN CHÍNH -->
    <div id="appCore">
        <div class="layout-wrapper">
            
            <!-- Sidebar Navigation -->
            <nav class="sidebar">
                <div class="brand">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    KTA.Teams
                </div>
                
                <a class="nav-item active ripple" onclick="KTA_App.Nav.switch('tab-create', this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    Tạo Kèo Đấu
                </a>
                <a class="nav-item ripple" onclick="KTA_App.Nav.switch('tab-manage', this); KTA_App.Data.fetchMatches();">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    Quản Lý Kèo
                </a>
                <a class="nav-item ripple" onclick="KTA_App.Nav.switch('tab-finance', this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    Máy Chia Tiền
                </a>
                
                <div style="flex:1"></div>
                
                <a class="nav-item ripple" onclick="KTA_App.Security.logout()" style="color: var(--danger);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Khóa Hệ Thống
                </a>
            </nav>

            <!-- Main Content Area -->
            <main class="main-content">
                <div class="header-top">
                    <h1 class="header-title" id="pageTitle">Tạo Kèo Mới</h1>
                    <div class="header-user">
                        <div class="avatar" id="avatarLetter">A</div>
                        <span id="displayHostName" style="font-weight: 600; font-size: 14px;">Kim Tuấn An</span>
                    </div>
                </div>

                <!-- TAB 1: TẠO KÈO (FLOATING FORMS) -->
                <div id="tab-create" class="tab-pane active">
                    <div class="glass-card">
                        <h2 style="font-size: 18px; margin-bottom: 24px; color: var(--accent);">📝 Thông tin Buổi Đánh</h2>
                        
                        <form id="formCreate" onsubmit="KTA_App.Data.submitMatch(event)">
                            <div class="form-group">
                                <input type="text" id="sesTime" class="form-input" placeholder=" " required>
                                <label for="sesTime" class="form-label">Thời gian (VD: 19:00 - 22:00 | 28/10)</label>
                            </div>

                            <div class="form-group">
                                <input type="text" id="sesLocation" class="form-input" placeholder=" " required>
                                <label for="sesLocation" class="form-label">Tên Sân & Địa chỉ</label>
                            </div>

                            <div class="grid-2">
                                <div class="form-group">
                                    <select id="sesShuttle" class="form-input" required>
                                        <option value="VinaStar">VinaStar</option>
                                        <option value="Thành Công">Thành Công</option>
                                        <option value="Lining A+">Lining A+</option>
                                    </select>
                                    <label class="form-label" style="top:-10px; left:12px; font-size:12px; background:var(--bg-surface);">Loại cầu</label>
                                    <svg class="select-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                </div>
                                <div class="form-group">
                                    <input type="number" id="sesMax" class="form-input" placeholder=" " value="8" min="2" max="20" required>
                                    <label for="sesMax" class="form-label">Giới hạn số Slot</label>
                                </div>
                            </div>

                            <div class="form-group">
                                <input type="text" id="sesLevel" class="form-input" placeholder=" " value="Từ Lvl 3 (TB Yếu) trở lên" required>
                                <label for="sesLevel" class="form-label">Yêu cầu Trình độ</label>
                            </div>

                            <button type="submit" id="btnSubmitMatch" class="btn btn-primary ripple">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                Phát Kèo Lên Máy Chủ
                            </button>
                        </form>
                    </div>
                </div>

                <!-- TAB 2: QUẢN LÝ -->
                <div id="tab-manage" class="tab-pane">
                    <div class="glass-card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                            <h2 style="font-size: 18px; color: var(--accent);">📋 Danh sách Kèo đã phát</h2>
                            <button onclick="KTA_App.Data.fetchMatches()" style="background:transparent; border:none; color:white; cursor:pointer;">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                            </button>
                        </div>
                        <div class="data-list" id="matchesList">
                            <!-- Dữ liệu render JS -->
                            <div style="text-align:center; color:var(--text-secondary); padding: 20px;">Đang đồng bộ dữ liệu...</div>
                        </div>
                    </div>
                </div>

                <!-- TAB 3: MÁY TÍNH TIỀN -->
                <div id="tab-finance" class="tab-pane">
                    <div class="glass-card">
                        <h2 style="font-size: 18px; margin-bottom: 24px; color: var(--accent);">💰 Máy Chia Tiền Smart</h2>
                        
                        <div class="form-group">
                            <input type="number" id="calcCourt" class="form-input" placeholder=" " oninput="KTA_App.Finance.calculate()">
                            <label for="calcCourt" class="form-label">Tiền Sân (VNĐ)</label>
                        </div>
                        <div class="form-group">
                            <input type="number" id="calcShuttle" class="form-input" placeholder=" " oninput="KTA_App.Finance.calculate()">
                            <label for="calcShuttle" class="form-label">Tiền Cầu (VNĐ)</label>
                        </div>
                        <div class="form-group">
                            <input type="number" id="calcPeople" class="form-input" placeholder=" " oninput="KTA_App.Finance.calculate()">
                            <label for="calcPeople" class="form-label">Số người Share Bill</label>
                        </div>

                        <div style="background: rgba(0,0,0,0.5); padding: 20px; border-radius: var(--radius-md); border: 1px dashed var(--accent); margin-top: 20px;">
                            <div style="display:flex; justify-content:space-between; margin-bottom: 10px; color: var(--text-secondary);">
                                <span>Tổng Bill:</span> <span id="resTotal" style="color:white; font-weight:600;">0 ₫</span>
                            </div>
                            <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;"></div>
                            <div style="text-align:center; font-size: 14px; color: var(--text-secondary); margin-bottom: 5px;">Mỗi người thanh toán</div>
                            <div id="resPerPerson" style="text-align:center; font-size: 32px; font-weight: 800; color: var(--accent);">0 ₫</div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- KHU VỰC CHỨA TOAST -->
    <div id="toastArea"></div>

    <!-- SCRIPT HỆ THỐNG OOP -->
    <script>
        /**
         * KTA WORKSPACE CORE
         * Xây dựng chuyên biệt, tối ưu cực mượt, chống lỗi fetch CORS
         */
        const CONFIG = {
            // DÁN LINK GOOGLE APPS SCRIPT (DEPOLY MỚI) VÀO ĐÂY
            API_URL: 'https://script.google.com/macros/s/AKfycbzOZgNrN2ynajhIq-5HM1dp6SgoUhc353H8s3sjbGuajyYRj6AS2B6o5QJBhJCkjtg/exec',
            PIN: '2026' // Mã PIN (4 số)
        };

        const KTA_App = {
            State: {
                currentPin: '',
                hostName: 'Kim Tuấn An' // Mặc định
            },

            // 1. MODULE BẢO MẬT & MÀN HÌNH KHÓA
            Security: {
                init: function() {
                    if (sessionStorage.getItem('kta_unlocked') === 'true') {
                        this.unlock();
                    }
                    // Thử lấy tên Host đã lưu ở máy (nếu từng đăng ký form User)
                    const savedUser = localStorage.getItem('kta_user');
                    if(savedUser) {
                        try {
                            const u = JSON.parse(savedUser);
                            KTA_App.State.hostName = u.name;
                            document.getElementById('displayHostName').innerText = u.name;
                            document.getElementById('avatarLetter').innerText = u.name.charAt(0).toUpperCase();
                        } catch(e){}
                    }
                },
                press: function(num) {
                    if (KTA_App.State.currentPin.length < 4) {
                        KTA_App.State.currentPin += num;
                        this.updateDots();
                        if (KTA_App.State.currentPin.length === 4) this.verify();
                    }
                },
                delete: function() {
                    KTA_App.State.currentPin = KTA_App.State.currentPin.slice(0, -1);
                    this.updateDots();
                },
                updateDots: function() {
                    const len = KTA_App.State.currentPin.length;
                    for(let i=1; i<=4; i++) {
                        const dot = document.getElementById(`dot-${i}`);
                        dot.className = 'dot' + (i <= len ? ' filled' : '');
                    }
                },
                verify: function() {
                    if (KTA_App.State.currentPin === CONFIG.PIN) {
                        sessionStorage.setItem('kta_unlocked', 'true');
                        this.unlock();
                    } else {
                        // Hiệu ứng Rung (Shake) khi sai pass
                        const container = document.getElementById('lockContainer');
                        container.classList.add('shake-anim');
                        document.querySelectorAll('.dot').forEach(d => d.classList.add('error'));
                        setTimeout(() => {
                            container.classList.remove('shake-anim');
                            KTA_App.State.currentPin = '';
                            this.updateDots();
                        }, 400);
                    }
                },
                unlock: function() {
                    const lock = document.getElementById('lockScreen');
                    const app = document.getElementById('appCore');
                    lock.style.opacity = '0';
                    setTimeout(() => {
                        lock.style.visibility = 'hidden';
                        app.style.display = 'block';
                        // Trigger reflow
                        void app.offsetWidth;
                        app.style.opacity = '1';
                    }, 500);
                },
                logout: function() {
                    sessionStorage.removeItem('kta_unlocked');
                    window.location.reload();
                }
            },

            // 2. MODULE NAVIGATION
            Nav: {
                switch: function(tabId, element) {
                    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                    element.classList.add('active');
                    
                    document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
                    document.getElementById(tabId).classList.add('active');

                    // Đổi tiêu đề Header
                    const titles = {'tab-create': 'Tạo Kèo Mới', 'tab-manage': 'Quản Lý Kèo', 'tab-finance': 'Máy Chia Tiền'};
                    document.getElementById('pageTitle').innerText = titles[tabId];
                }
            },

            // 3. MODULE API & DỮ LIỆU
            Data: {
                // Wrapper Call API chống lỗi CORS thông minh bằng fetch redirect:follow
                apiCall: async function(action, payload) {
                    try {
                        const response = await fetch(`${CONFIG.API_URL}?action=${action}`, {
                            method: 'POST',
                            redirect: 'follow',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload)
                        });
                        return await response.json();
                    } catch(e) {
                        console.error('Fetch Error:', e);
                        throw e;
                    }
                },

                submitMatch: async function(e) {
                    e.preventDefault();
                    const btn = document.getElementById('btnSubmitMatch');
                    const ogHtml = btn.innerHTML;
                    btn.innerHTML = '<svg class="select-icon" style="animation:spin 1s linear infinite;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 1 10 10"></path></svg> Đang tải lên...';
                    btn.disabled = true;

                    const matchData = {
                        id: 'S_' + Date.now(),
                        host: KTA_App.State.hostName,
                        time: document.getElementById('sesTime').value,
                        location: document.getElementById('sesLocation').value,
                        shuttlecock: document.getElementById('sesShuttle').value,
                        max: document.getElementById('sesMax').value,
                        level: document.getElementById('sesLevel').value,
                        status: 'OPEN'
                    };

                    try {
                        await this.apiCall('createSession', matchData);
                        KTA_App.UI.toast('success', 'Phát kèo thành công! Đã đẩy lên máy chủ.');
                        document.getElementById('formCreate').reset();
                    } catch(err) {
                        KTA_App.UI.toast('error', 'Lỗi mạng! Không thể lưu vào Database.');
                    } finally {
                        btn.innerHTML = ogHtml;
                        btn.disabled = false;
                    }
                },

                fetchMatches: async function() {
                    const list = document.getElementById('matchesList');
                    list.innerHTML = '<div style="text-align:center; padding: 20px;"><svg style="animation:spin 1s linear infinite; color:var(--accent);" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 1 10 10"></path></svg></div>';
                    
                    try {
                        const res = await fetch(CONFIG.API_URL);
                        const data = await res.json();
                        
                        if(!data || data.length === 0) {
                            list.innerHTML = '<div style="text-align:center; color:var(--text-secondary); padding: 20px;">Hệ thống chưa có kèo nào.</div>';
                            return;
                        }
                        
                        list.innerHTML = '';
                        // Render ds
                        data.reverse().forEach(s => {
                            const html = `
                                <div class="data-item">
                                    <div>
                                        <div style="font-weight:700; font-size:15px; margin-bottom:4px; color:white;">${s.Location}</div>
                                        <div style="font-size:13px; color:var(--text-secondary);">⏰ ${s.Time} &nbsp;|&nbsp; 🏸 ${s.Shuttlecock}</div>
                                    </div>
                                    <div class="badge">${s.Status}</div>
                                </div>
                            `;
                            list.insertAdjacentHTML('beforeend', html);
                        });
                    } catch(e) {
                        list.innerHTML = '<div style="color:var(--danger); text-align:center; padding:20px;">Lỗi kéo dữ liệu!</div>';
                    }
                }
            },

            // 4. MODULE TÀI CHÍNH (Chia tiền)
            Finance: {
                calculate: function() {
                    const c = Number(document.getElementById('calcCourt').value) || 0;
                    const s = Number(document.getElementById('calcShuttle').value) || 0;
                    const p = Number(document.getElementById('calcPeople').value) || 0;
                    
                    const total = c + s;
                    const split = p > 0 ? (total / p) : 0;
                    
                    const f = (num) => Math.ceil(num).toLocaleString('vi-VN') + ' ₫';
                    document.getElementById('resTotal').innerText = f(total);
                    document.getElementById('resPerPerson').innerText = f(split);
                }
            },

            // 5. MODULE UI & TOAST
            UI: {
                toast: function(type, msg) {
                    const area = document.getElementById('toastArea');
                    const toast = document.createElement('div');
                    toast.className = `kta-toast ${type}`;
                    
                    const icon = type === 'success' 
                        ? `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`
                        : `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;

                    toast.innerHTML = `${icon} <div style="font-size:14px; font-weight:600;">${msg}</div> <div class="toast-progress"></div>`;
                    area.appendChild(toast);
                    
                    // Trigger reflow & animation
                    void toast.offsetWidth;
                    toast.classList.add('show');
                    
                    setTimeout(() => {
                        toast.classList.remove('show');
                        setTimeout(() => toast.remove(), 500);
                    }, 3000);
                }
            }
        };

        // STYLE ANIMATION CHO SVG
        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);

        // Khởi động
        document.addEventListener('DOMContentLoaded', () => {
            KTA_App.Security.init();
        });
    </script>
</body>
</html>
