<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KTA Host Panel | Quản Trị Hệ Thống</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. CORE VARIABLES & RESET (Đồng bộ thiết kế với index.html)
           ========================================================================== */
        :root {
            --bg-base: #0b1120; --bg-surface: #1e293b; --bg-light: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc; --text-muted: #94a3b8; --text-tertiary: #64748b;
            --accent: #10b981; --accent-hover: #059669; /* Đổi tông xanh lá cho Host */
            --danger: #ef4444; --warning: #f59e0b; --primary: #3b82f6;
            --radius-md: 12px; --radius-lg: 16px; --radius-pill: 9999px;
            --trans: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-base); color: var(--text-main); line-height: 1.5; min-height: 100vh; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px; display: flex; flex-direction: column; align-items: center; }
        
        .app-container { width: 100%; max-width: 540px; position: relative; padding-bottom: 80px; display: none; }
        
        /* ==========================================================================
           2. SECURITY SCREEN (Màn hình khóa Passcode)
           ========================================================================== */
        #securityScreen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 17, 32, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .pin-box { background: var(--bg-surface); padding: 30px 24px; border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 360px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .pin-box svg { width: 48px; height: 48px; color: var(--accent); margin-bottom: 16px; }
        .pin-input { width: 100%; letter-spacing: 8px; text-align: center; font-size: 24px; font-weight: 800; padding: 16px; background: rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.1); border-radius: var(--radius-md); color: white; margin: 20px 0; transition: var(--trans); outline: none; }
        .pin-input:focus { border-color: var(--accent); }
        .pin-error { color: var(--danger); font-size: 13px; font-weight: 600; margin-bottom: 16px; display: none; }

        /* ==========================================================================
           3. UI COMPONENTS (Tabs, Header, Forms, Buttons)
           ========================================================================== */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--bg-light); margin-bottom: 20px; }
        .header-title { font-size: 20px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .btn-logout { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: none; padding: 8px 16px; border-radius: var(--radius-pill); font-weight: 700; font-size: 12px; cursor: pointer; }

        .tabs-nav { display: flex; background: var(--bg-light); padding: 4px; border-radius: var(--radius-md); margin-bottom: 24px; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 600; color: var(--text-muted); background: transparent; border: none; border-radius: 8px; cursor: pointer; transition: var(--trans); }
        .tab-btn.active { background: var(--bg-surface); color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--bg-surface); padding: 20px; border-radius: var(--radius-lg); border: 1px solid var(--bg-light); margin-bottom: 16px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
        
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .form-control { width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-md); color: white; font-size: 15px; transition: var(--trans); outline: none; }
        .form-control:focus { border-color: var(--accent); background: rgba(16, 185, 129, 0.05); }
        select.form-control { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 16px center; background-size: 16px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn { width: 100%; padding: 16px; border-radius: var(--radius-md); font-weight: 700; font-size: 15px; border: none; cursor: pointer; transition: var(--trans); display: flex; justify-content: center; align-items: center; gap: 8px; color: white; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.6; pointer-events: none; }
        .btn-primary { background: var(--accent); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-outline { background: transparent; border: 1px solid var(--text-tertiary); color: var(--text-main); }
        .btn-danger { background: rgba(239,68,68,0.2); color: var(--danger); }

        /* ==========================================================================
           4. SESSION LIST & BILL SPLITTER STYLES
           ========================================================================== */
        .session-item { border-bottom: 1px solid var(--bg-light); padding-bottom: 16px; margin-bottom: 16px; }
        .session-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
        .s-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: #fff; }
        .s-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 12px; margin-bottom: 12px; }
        
        .calc-box { background: rgba(0,0,0,0.3); border: 1px dashed rgba(255,255,255,0.2); border-radius: var(--radius-md); padding: 16px; margin-top: 20px; }
        .calc-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; }
        .calc-total { font-size: 24px; font-weight: 800; color: var(--accent); text-align: center; margin: 16px 0; }

        /* Toasts & Loaders */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
        .toast { background: var(--bg-surface); padding: 16px 20px; border-radius: var(--radius-md); box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; transform: translateY(-50px); opacity: 0; transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); border-left: 4px solid var(--accent); color: white; font-weight: 600; font-size: 14px; }
        .toast.error { border-left-color: var(--danger); }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH BẢO MẬT -->
    <div id="securityScreen">
        <div class="pin-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <h2 style="font-size: 18px; margin-bottom: 8px;">Khu Vực Quản Trị</h2>
            <p style="font-size: 13px; color: var(--text-muted);">Vui lòng nhập Mã PIN để vào KTA Host Panel</p>
            
            <input type="password" id="pinInput" class="pin-input" maxlength="10" placeholder="••••" onkeypress="if(event.key === 'Enter') HostApp.Auth.verifyPin()">
            <div id="pinError" class="pin-error">Mã PIN không chính xác!</div>
            
            <button class="btn btn-primary" onclick="HostApp.Auth.verifyPin()" style="padding: 14px;">Mở Khóa</button>
            <p style="margin-top: 16px; font-size: 12px; color: var(--text-tertiary);">* Trở về <a href="index.html" style="color: var(--primary);">Trang chủ</a></p>
        </div>
    </div>

    <!-- ỨNG DỤNG CHÍNH -->
    <div class="app-container" id="mainApp">
        <header class="header">
            <div class="header-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                Host Panel
            </div>
            <button class="btn-logout" onclick="HostApp.Auth.logout()">Đóng phiên</button>
        </header>

        <div class="tabs-nav">
            <button class="tab-btn active" onclick="HostApp.UI.switchTab('tabCreate')">Tạo Kèo Mới</button>
            <button class="tab-btn" onclick="HostApp.UI.switchTab('tabManage')">Quản Lý & Chia Tiền</button>
        </div>

        <!-- TAB 1: FORM TẠO KÈO -->
        <div id="tabCreate" class="tab-content active">
            <div class="card">
                <form onsubmit="HostApp.Session.createSession(event)">
                    <div class="form-group">
                        <label class="form-label">Chủ kèo (Tên hiển thị)</label>
                        <input type="text" id="hostName" class="form-control" placeholder="VD: Kim Tuấn An" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Thời gian đánh</label>
                        <input type="text" id="sesTime" class="form-control" placeholder="VD: 19:00 - 22:00 | T6 (28/10)" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Tên sân & Vị trí</label>
                        <input type="text" id="sesLocation" class="form-control" placeholder="VD: Sân VinaSport, Sân số 3" required>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label class="form-label">Loại cầu</label>
                            <select id="sesShuttle" class="form-control">
                                <option>VinaStar</option>
                                <option>Thành Công</option>
                                <option>Lining A+</option>
                                <option>Blue Swallow</option>
                                <option>Khác</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Số Slot (Max)</label>
                            <input type="number" id="sesMax" class="form-control" value="8" min="2" max="20" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Yêu cầu Level</label>
                        <input type="text" id="sesLevel" class="form-control" value="Từ Lvl 3 (TB Yếu) trở lên" required>
                    </div>

                    <button type="submit" id="btnCreate" class="btn btn-primary" style="margin-top: 10px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Phát Kèo Lên Hệ Thống
                    </button>
                </form>
            </div>
        </div>

        <!-- TAB 2: QUẢN LÝ & CHIA TIẾN -->
        <div id="tabManage" class="tab-content">
            <div class="card" style="padding: 16px;">
                <h3 style="font-size: 16px; margin-bottom: 16px;">Danh sách kèo đã tạo</h3>
                <div id="mySessionsList">
                    <div style="text-align:center; padding: 20px; color: var(--text-tertiary); font-size: 14px;">Bấm 'Làm mới' để tải dữ liệu</div>
                </div>
                <button class="btn btn-outline" onclick="HostApp.API.fetchSessions()" style="margin-top: 16px; padding: 12px;">🔄 Làm mới dữ liệu</button>
            </div>

            <!-- CÔNG CỤ TÍNH TIỀN NHANH -->
            <div class="card">
                <h3 style="font-size: 16px; margin-bottom: 16px; color: var(--primary);">💰 Công Cụ Chia Tiền Bill</h3>
                <div class="form-group">
                    <label class="form-label">Tổng tiền Sân (VNĐ)</label>
                    <input type="number" id="billCourt" class="form-control" placeholder="VD: 300000" oninput="HostApp.Calculator.calcBill()">
                </div>
                <div class="form-group">
                    <label class="form-label">Tổng tiền Cầu (VNĐ)</label>
                    <input type="number" id="billShuttle" class="form-control" placeholder="VD: 250000" oninput="HostApp.Calculator.calcBill()">
                </div>
                <div class="form-group">
                    <label class="form-label">Tổng số người Share Bill</label>
                    <input type="number" id="billPeople" class="form-control" placeholder="VD: 8" oninput="HostApp.Calculator.calcBill()">
                </div>

                <div class="calc-box">
                    <div class="calc-row"><span>Tổng Bill:</span> <span id="resTotalBill">0 ₫</span></div>
                    <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 10px 0;"></div>
                    <div style="font-size: 13px; color: var(--text-muted); text-align: center;">Mỗi Lông thủ cần chuyển:</div>
                    <div class="calc-total" id="resPerPerson">0 ₫ / Người</div>
                </div>
            </div>
        </div>
    </div>

    <!-- TOASTS -->
    <div id="toast-container"></div>

    <script>
        const HostApp = {
            Config: {
                API_URL: 'https://script.google.com/macros/s/AKfycbzOZgNrN2ynajhIq-5HM1dp6SgoUhc353H8s3sjbGuajyYRj6AS2B6o5QJBhJCkjtg/exec',
                SECRET_PIN: 'kta2026' // Mã PIN bảo vệ trang Host
            },

            State: { rawSessions: [] },

            // Xác thực bảo mật (Passcode)
            Auth: {
                verifyPin: function() {
                    const input = document.getElementById('pinInput').value;
                    const errorMsg = document.getElementById('pinError');
                    if (input === HostApp.Config.SECRET_PIN) {
                        sessionStorage.setItem('kta_host_auth', 'true'); // Lưu session tạm
                        document.getElementById('securityScreen').style.display = 'none';
                        document.getElementById('mainApp').style.display = 'block';
                        
                        // Load dữ liệu cũ nếu có
                        const savedProfile = localStorage.getItem('kta_user_profile');
                        if (savedProfile) document.getElementById('hostName').value = JSON.parse(savedProfile).name;
                        
                        HostApp.API.fetchSessions();
                    } else {
                        errorMsg.style.display = 'block';
                        document.getElementById('pinInput').value = '';
                    }
                },
                checkSession: function() {
                    if (sessionStorage.getItem('kta_host_auth') === 'true') {
                        document.getElementById('securityScreen').style.display = 'none';
                        document.getElementById('mainApp').style.display = 'block';
                        HostApp.API.fetchSessions();
                    }
                },
                logout: function() {
                    sessionStorage.removeItem('kta_host_auth');
                    window.location.reload();
                }
            },

            // Giao diện (Tabs & Toasts)
            UI: {
                switchTab: function(tabId) {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    event.target.classList.add('active');
                    document.getElementById(tabId).classList.add('active');
                },
                showToast: function(type, msg) {
                    const container = document.getElementById('toast-container');
                    const toast = document.createElement('div');
                    toast.className = `toast ${type}`;
                    toast.innerHTML = msg;
                    container.appendChild(toast);
                    setTimeout(() => toast.classList.add('show'), 10);
                    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
                }
            },

            // Xử lý API & Sessions
            Session: {
                createSession: async function(e) {
                    e.preventDefault();
                    const btn = document.getElementById('btnCreate');
                    const ogText = btn.innerHTML;
                    btn.innerHTML = 'Đang đẩy lên hệ thống...'; btn.disabled = true;

                    const data = {
                        id: 'S_' + Date.now(),
                        host: document.getElementById('hostName').value.trim(),
                        time: document.getElementById('sesTime').value.trim(),
                        location: document.getElementById('sesLocation').value.trim(),
                        shuttlecock: document.getElementById('sesShuttle').value,
                        max: document.getElementById('sesMax').value,
                        level: document.getElementById('sesLevel').value.trim(),
                        status: 'OPEN'
                    };

                    try {
                        await fetch(HostApp.Config.API_URL + '?action=createSession', {
                            method: 'POST', body: JSON.stringify(data)
                        });
                        HostApp.UI.showToast('success', '✅ Đã phát kèo thành công!');
                        e.target.reset(); // Reset form
                        // Load lại danh sách và nhảy qua tab Quản lý
                        HostApp.API.fetchSessions();
                        setTimeout(() => { document.querySelectorAll('.tab-btn')[1].click(); }, 1000);
                    } catch (err) {
                        HostApp.UI.showToast('error', '❌ Lỗi kết nối!');
                    } finally {
                        btn.innerHTML = ogText; btn.disabled = false;
                    }
                }
            },

            // Lấy danh sách để quản lý
            API: {
                fetchSessions: async function() {
                    const list = document.getElementById('mySessionsList');
                    list.innerHTML = '<div style="text-align:center; padding: 20px; font-size:13px;">Đang tải danh sách...</div>';
                    
                    try {
                        const res = await fetch(HostApp.Config.API_URL);
                        const data = await res.json();
                        
                        if(!data || data.length === 0) {
                            list.innerHTML = '<div style="text-align:center; color:#64748b; font-size:13px;">Chưa có kèo nào.</div>';
                            return;
                        }
                        
                        list.innerHTML = '';
                        data.reverse().forEach(s => {
                            const html = `
                                <div class="session-item">
                                    <div class="s-title">${s.Location}</div>
                                    <div class="s-meta">
                                        <span>⏰ ${s.Time}</span>
                                        <span style="color:var(--accent); font-weight:bold;">[${s.Status}]</span>
                                    </div>
                                    <div style="display:flex; gap:8px;">
                                        <button class="btn btn-outline" style="padding:10px; font-size:13px;" onclick="alert('Tính năng quản lý người xin slot trong kèo này sẽ được mở rộng trong Phase 2!')">Xem DS Slot</button>
                                        <button class="btn btn-danger" style="padding:10px; font-size:13px; flex:0.4;" onclick="alert('Do đang dùng chung DB Google Sheets, tính năng xóa kèo tạm khóa để bảo vệ dữ liệu.')">Xóa</button>
                                    </div>
                                </div>
                            `;
                            list.insertAdjacentHTML('beforeend', html);
                        });
                    } catch(err) {
                        list.innerHTML = '<div style="color:var(--danger); font-size:13px; text-align:center;">Lỗi mạng!</div>';
                    }
                }
            },

            // Máy tính chia tiền tự động
            Calculator: {
                calcBill: function() {
                    const court = Number(document.getElementById('billCourt').value) || 0;
                    const shuttle = Number(document.getElementById('billShuttle').value) || 0;
                    const people = Number(document.getElementById('billPeople').value) || 0;

                    const total = court + shuttle;
                    const perPerson = people > 0 ? (total / people) : 0;

                    // Format tiền tệ VNĐ
                    const formatMoney = (amount) => Math.ceil(amount).toLocaleString('vi-VN') + ' ₫';

                    document.getElementById('resTotalBill').innerText = formatMoney(total);
                    document.getElementById('resPerPerson').innerText = formatMoney(perPerson);
                }
            }
        };

        // Khởi động khi tải xong trang
        document.addEventListener('DOMContentLoaded', () => {
            HostApp.Auth.checkSession();
        });
    </script>
</body>
</html>
