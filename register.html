<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Khai Báo Trình Độ | KTA Badminton</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 0 50px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h2 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .input-text {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-text:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
        }

        .level-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .level-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 14px 14px 46px;
            cursor: pointer;
            transition: 0.2s;
        }

        .level-card:active {
            transform: scale(0.98);
        }

        .level-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .radio-mark {
            position: absolute;
            top: 16px;
            left: 14px;
            height: 20px;
            width: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            transition: 0.2s;
        }

        .level-card input:checked ~ .radio-mark {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.2);
        }

        .level-card input:checked ~ .radio-mark:after {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }

        .level-card:has(input:checked) {
            background: rgba(59, 130, 246, 0.08);
            border-color: var(--accent);
        }

        .level-title {
            font-weight: 600;
            font-size: 14.5px;
            margin-bottom: 3px;
            color: #fff;
        }

        .level-card:has(input:checked) .level-title {
            color: #60a5fa;
        }

        .level-desc {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            margin-top: 24px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.97);
            background: var(--accent-hover);
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13.5px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Khai Báo Hồ Sơ</h2>
            <p>Chọn đúng trình độ để Host cáp kèo đánh đôi cho chuẩn nhé!</p>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Họ và Tên (Tên thường gọi)</label>
                <input type="text" id="fullName" class="input-text" placeholder="VD: Kim Tuấn An" required>
            </div>

            <div class="form-group">
                <label>Trình độ cầu lông của bạn:</label>
                <div class="level-list">
                    
                    <label class="level-card">
                        <input type="radio" name="playerLevel" value="Lvl 1 - Newbie" required>
                        <span class="radio-mark"></span>
                        <div class="level-title">Lvl 1: Newbie / Mới tập</div>
                        <div class="level-desc">Mới cầm vợt, chưa nắm rõ luật, đánh cầu chưa trúng tâm hoặc hay hụt.</div>
                    </label>

                    <label class="level-card">
                        <input type="radio" name="playerLevel" value="Lvl 2 - Yếu">
                        <span class="radio-mark"></span>
                        <div class="level-title">Lvl 2: Yếu</div>
                        <div class="level-desc">Đã biết luật. Phông cầu chưa tới cuối sân, di chuyển lộn xộn, hay đứng nhìn đồng đội.</div>
                    </label>

                    <label class="level-card">
                        <input type="radio" name="playerLevel" value="Lvl 3 - TB Yếu">
                        <span class="radio-mark"></span>
                        <div class="level-title">Lvl 3: Trung bình Yếu (TB Yếu)</div>
                        <div class="level-desc">Biết phông, biết đập nhẹ. Lót cầu cơ bản nhưng độ ổn định chưa cao, thể lực mau xuống.</div>
                    </label>

                    <label class="level-card">
                        <input type="radio" name="playerLevel" value="Lvl 4 - TB Trừ">
                        <span class="radio-mark"></span>
                        <div class="level-title">Lvl 4: Trung bình Trừ (TB-)</div>
                        <div class="level-desc">Nắm vững cơ bản. Đập có lực hơn, biết bỏ nhỏ nhưng phản tạt và phòng thủ còn yếu.</div>
                    </label>

                    <label class="level-card">
                        <input type="radio" name="playerLevel" value="Lvl 5 - Trung Bình">
                        <span class="radio-mark"></span>
                        <div class="level-title">Lvl 5: Trung bình (TB)</div>
                        <div class="level-desc">Đánh ổn định. Phông sâu, đập có lực, thủ tốt. Hiểu rõ cách di chuyển đánh đôi.</div>
                    </label>

                    <label class="level-card">
                        <input type="radio" name="playerLevel" value="Lvl 6 - TB Cộng">
                        <span class="radio-mark"></span>
                        <div class="level-title">Lvl 6: Trung bình Cộng (TB+)</div>
                        <div class="level-desc">Kỹ thuật toàn diện. Di chuyển linh hoạt, đập cắm, thủ phản tạt tốt, bắt lưới nhanh nhạy.</div>
                    </label>

                    <label class="level-card">
                        <input type="radio" name="playerLevel" value="Lvl 7 - Khá">
                        <span class="radio-mark"></span>
                        <div class="level-title">Lvl 7: Khá</div>
                        <div class="level-desc">Người chơi lâu năm, kỹ năng khó (cắt, chém, đập gập cổ tay) thành thạo. Tốc độ trận đấu cao.</div>
                    </label>

                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Lưu Hồ Sơ & Vào Sân</button>
        </form>

        <div class="footer">KTA.Teams Badminton System</div>
    </div>

    <div id="toast">Thông báo</div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzOZgNrN2ynajhIq-5HM1dp6SgoUhc353H8s3sjbGuajyYRj6AS2B6o5QJBhJCkjtg/exec';

        // Tự điền tên cũ nếu đã từng đăng ký trước đó trên máy
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('kta_user');
            if (saved) {
                try {
                    const u = JSON.parse(saved);
                    document.getElementById('fullName').value = u.name;
                    // Tick lại radio level cũ nếu có
                    const radios = document.querySelectorAll('input[name="playerLevel"]');
                    radios.forEach(r => {
                        if (r.value === u.level) r.checked = true;
                    });
                } catch(e) {}
            }
        });

        async function handleRegister(event) {
            event.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Đang đồng bộ lên Google Sheets...';
            btn.disabled = true;

            const name = document.getElementById('fullName').value.trim();
            const level = document.querySelector('input[name="playerLevel"]:checked').value;

            const userData = {
                id: 'U_' + Date.now(),
                name: name,
                level: level,
                role: 'user'
            };

            try {
                // Gửi dữ liệu về Google Apps Script
                await fetch(API_URL + '?action=registerUser', {
                    method: 'POST',
                    body: JSON.stringify(userData),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                // Lưu vào bộ nhớ máy
                localStorage.setItem('kta_user', JSON.stringify(userData));

                showToast('✅ Lưu hồ sơ thành công!');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (err) {
                showToast('❌ Lỗi kết nối, vui lòng thử lại!');
                btn.innerText = 'Lưu Hồ Sơ & Vào Sân';
                btn.disabled = false;
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
